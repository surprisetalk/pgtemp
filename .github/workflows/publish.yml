name: publish

# Publishes whenever deno.json's version is one JSR hasn't seen; pushes that
# don't bump it are skipped, not failed. So the version field is the release
# trigger — no tag required.
on:
  push:
    branches: [main]
  workflow_dispatch:

jobs:
  publish:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      id-token: write # JSR provenance via OIDC — no token needed
    steps:
      - uses: actions/checkout@v7
      - uses: denoland/setup-deno@v2
        with:
          deno-version: v2.x
      # ci.yml covers this same push, but it is a separate run and cannot gate
      # this one — so re-check here rather than publish something unverified.
      - run: deno fmt --check
      - run: deno lint
      - run: deno check mod.ts mod.test.ts
      - run: deno task test
      - run: deno publish
